[core]
# Luigi configuration for TICL NanoAOD Validation

# Use local scheduler by default (no central server needed)
local-scheduler: True

# Number of parallel workers
parallel-scheduling: True
workers: 4

# Logging
logging_conf_file:
log_level: WARNING

[worker]
# Worker configuration
keep_alive: False
wait_interval: 10
wait_jitter: 5
max_keep_alive_idle_duration: 0

[scheduler]
# Scheduler configuration
record_task_history: True
state_path: .law/luigi-state.pickle
remove_delay: 600
retry_delay: 30
worker_disconnect_delay: 60

[htcondor]
# HTCondor configuration
parallel_scheduling_processes: 10
