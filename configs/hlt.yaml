# Collection schema for HLT NanoAOD (e.g. step2.root).
# Identical structure to offline.yaml; only the physical names differ.
#
# HLT files contain BOTH sim2reco and reco2sim associations, so the efficiency
# module computes efficiency *and* fake rate.

schema:
  name: hlt

  fields:
    eta:    "{coll}_barycenter_eta"
    phi:    "{coll}_barycenter_phi"
    energy: "{coll}_raw_energy"
    pt:     "{coll}_raw_pt"

  associations:
    sim2reco: "{sim}2{reco}ByHits"
    reco2sim: "Reco{reco}2{sim}ByHits"

  reco:
    clue3d:          hltTiclTrackstersCLUE3DHigh
    links:           hltTiclTracksterLinks
    superclustering: hltTiclTracksterLinksSuperclusteringDNN
    candidate:       hltTiclCandidate

  sim:
    cp: { token: SimCP, tracksters: hltTiclSimTrackstersfromCPs }
    sc: { token: SimSC, tracksters: hltTiclSimTracksters }
