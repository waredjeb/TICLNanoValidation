[core]
# LAW configuration for TICL NanoAOD Validation

[modules]
tasks

[logging]
law: WARNING
luigi-interface: WARNING

[job]
job_file_dir: $LAW_JOB_FILE_DIR
job_file_dir_mkdtemp: True
job_file_dir_cleanup: False

[htcondor_workflow]
htcondor_flavor: default
htcondor_pool:
htcondor_scheduler:
request_cpus: 1
request_memory: 2GB
request_disk: 1GB
universe: vanilla
log: $LAW_JOB_FILE_DIR/job.log
output: $LAW_JOB_FILE_DIR/job.out
error: $LAW_JOB_FILE_DIR/job.err
+MaxRuntime: 3600

[outputs]
# Output configuration
wlcg_file_systems: wlcg_fs
default_wlcg_fs: wlcg_fs_ticl

[wlcg_fs_ticl]
base: /eos/user/${USER:0:1}/${USER}/TICLNanoValidation
create_file_dir: True
use_cache: False
cache_root: $LAW_TARGET_CACHE
cache_cleanup: False
cache_max_size: 50GB
