[modules]
workflow.tasks

[logging]
law: INFO
luigi-interface: WARNING

[job]
job_file_dir: $LAW_HOME/jobs
job_file_dir_mkdtemp: True
job_file_dir_cleanup: False

[target]
default_wlcg_fs: wlcg_fs_ticl

# EOS user area, accessed via XRootD. The base is computed in setup.sh and
# exported as TICLNANOVAL_EOS_BASE (bash substring expansion can't live here).
# Override TICLNANOVAL_EOS_BASE in your shell to point elsewhere.
[wlcg_fs_ticl]
base: $TICLNANOVAL_EOS_BASE
create_file_dir: True
use_cache: False
